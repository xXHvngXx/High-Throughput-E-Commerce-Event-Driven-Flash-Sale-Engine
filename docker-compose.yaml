version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flashsale_postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: flashsale_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: flashsale_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/
  rabbittmp:
    image: rabbitmq:3-management
    ports:
      -"5672:5672"
      -"15672:15672"
      

volumes:
  postgres_data:
  redis_data: