spring:
  application:
    name: core-service

  # Bật Virtual Threads (Java 21) để tối ưu chịu tải đồng thời
  threads:
    virtual:
      enabled: true

  # Kết nối PostgreSQL (trùng với docker-compose.yml ở thư mục gốc)
  datasource:
    url: jdbc:postgresql://localhost:5432/flashsale_db
    username: root
    password: secretpassword
    driver-class-name: org.postgresql.Driver

  # Cấu hình Hibernate / JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Kết nối Redis
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080