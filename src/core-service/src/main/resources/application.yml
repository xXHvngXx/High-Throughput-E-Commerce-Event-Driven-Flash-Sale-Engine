spring:
  application:
    name: core-service

  # Cấu hình kết nối PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/flashsale_db
    username: root
    password: secretpassword
    driver-class-name: org.postgresql.Driver

  # Cấu hình Hibernate / JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Cấu hình Redis
  data:
    redis:
      host: localhost
      port: 6379

  # Cấu hình RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # Chỉ 1 consumer ghi DB: ghi tuần tự nên không xung đột @Version
        concurrency: 1
        max-concurrency: 1
        # Lỗi tạm thời thì thử lại tối đa 5 lần
        retry:
          enabled: true
          max-attempts: 5

server:
  port: 8080